<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarCast 진단</title>
<meta name="carcast-build" content="__BUILD__">
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body class="diag">
<h1>CarCast 진단 <a href="index.html" class="link">← 돌아가기</a></h1>
<section class="summary-box">
  <div id="summary">측정 중…</div>
  <div id="report-result">결과는 끝나면 폰에 자동 저장됩니다</div>
</section>
<section>
  <h2>브라우저</h2>
  <table id="env"></table>
</section>
<section>
  <h2>API 지원</h2>
  <table id="api"></table>
</section>
<section>
  <h2>하드웨어 디코더 (WebCodecs)</h2>
  <div id="codec-note"></div>
  <table id="codec"></table>
</section>
<section>
  <h2>WebSocket 연결 (<span id="ws-n">0</span>/20)</h2>
  <div id="ws-result">대기 중</div>
</section>
<section>
  <h2>영상 디코드</h2>
  <div id="video-result">대기 중</div>
  <!-- 본 화면과 같은 경로(paths.ts)로 그린다. 렌더러가 프레임 크기로 키우므로 보이는 크기만 잡아 둔다. -->
  <canvas id="gl" style="width:320px;height:180px;background:#000"></canvas>
</section>
<section>
  <h2>사설 주소 차단 확인 (대조군)</h2>
  <div id="addr-result">대기 중</div>
</section>
<section>
  <h2>링크 (N 바이트가 걸리는 시간 — IDR 한 장의 값)</h2>
  <div id="link-result">대기 중</div>
</section>
<section>
  <h2>WebRTC (가능성 확인)</h2>
  <div id="rtc-note"></div>
  <table id="rtc"></table>
</section>
<section>
  <h2>로그</h2>
  <pre id="log"></pre>
</section>
<script src="diag.js?v=__BUILD__"></script>
</body>
</html>
