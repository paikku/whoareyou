<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CarCast</title>
<!-- __BUILD__ 는 폰 서버가 APK 의 빌드 sha 로 바꿔 준다(core HttpServer.serveStatic). 그 값으로 자산 URL 을
     버전 지정해 차 브라우저가 한 번 받은 것을 다시 받지 않게 한다. 가짜 폰은 바꾸지 않으므로 그대로 남는다. -->
<meta name="carcast-build" content="__BUILD__">
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
<div id="stage">
  <!-- 두 경로(소프트 h264 = WebGL2, 하드웨어 webcodecs = 2D)가 그리는 캔버스. paths.ts -->
  <canvas id="gl" hidden></canvas>
  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-title">CarCast</div>
      <div id="overlay-msg">화면을 터치하면 시작합니다</div>
    </div>
  </div>
  <!-- 그림이 멈췄을 때 "왜"와 "그래서 뭘 누르면 되는지"를 그 자리에 보여 준다. 얼어붙은 화면만 남기지 않는다. -->
  <div id="state" class="overlay state" data-ui hidden>
    <div class="overlay-card">
      <div id="state-title" class="overlay-title"></div>
      <div id="state-msg"></div>
      <div class="state-actions">
        <button id="state-action" class="state-action" hidden></button>
        <!-- 두 번째 선택지(덜 흔한 쪽): 옮기다 깨진 앱을 처음부터 새로 여는 길. 기본 버튼보다 낮게 그린다. -->
        <button id="state-alt" class="state-action alt" hidden></button>
      </div>
    </div>
  </div>
  <!--
    차의 홈과 최근앱. 폰의 HOME/APP_SWITCH 키를 보내지 않는 이유는 main.ts 의 주석에 있다 —
    그 키들은 폰의 기본 디스플레이 것이고, 누르면 차에서 보던 앱이 폰으로 끌려간다.
  -->
  <!-- 화질: 폰 인코더의 크기·fps·비트레이트를 차에서 고른다(/api/encoder). 자동은 내리기만 한다. 아래에 끝에서
       끝까지의 지연을 재는 버튼 — 폰의 측정 액티비티를 띄우고 화면이 뒤집히는 시간을 잰다.
       맨 위는 **경로**(무엇으로 풀어 그리는가) — 차도 폰도 세대가 다르니 고를 수 있어야 한다. paths.ts. -->
  <div id="quality" class="overlay sheet" data-ui hidden>
    <div class="sheet-head">
      <span class="sheet-title">화질</span>
      <span id="quality-now" class="sheet-note"></span>
      <button id="quality-close" class="sheet-close" title="닫기">✕</button>
    </div>
    <div class="sheet-sub">
      <span class="sheet-label">경로</span>
      <span id="path-note" class="sheet-note"></span>
    </div>
    <div id="path-grid" class="grid paths"></div>
    <div class="sheet-sub">
      <span class="sheet-label">해상도 · fps</span>
    </div>
    <div id="quality-grid" class="grid"></div>
    <label class="sheet-row"><input id="quality-auto" type="checkbox"> 차가 못 따라오면 자동으로 한 단계 내리기</label>
    <!-- 실험용 손잡이: 키프레임(IDR) 한 장 대신 I-매크로블록을 30 프레임에 나눠 싣는다. IDR 버스트가 링크를 막는 차에서
         켜 보고, 리포트의 keyBytes·드롭이 어떻게 달라지는지 본다(car-tests/model-y §11). 폰이 그 값을 말해 줄 때만 산다. -->
    <label class="sheet-row"><input id="quality-intra" type="checkbox"> 키프레임 대신 인트라 리프레시 (실험 · IDR 버스트 없애기)</label>
    <!-- I 프레임 QP 하한 = 차가 부탁한 키프레임(IDR)의 바이트 상한. 폰 벤치(car-tests/model-y §13)에서 이 손잡이가
         먹는 것은 확인됐고(쉬운 화면 48.6 → 7 KB), 실제 화면에서 몇에 물리는지는 차에서 돌려 봐야 안다. 바꾸면 인코더가
         다시 서고(2 초 잠금) 폰이 encoder.conf 에 남긴다. 리포트 perf 의 keyBytes 가 이 손잡이의 성적이다. -->
    <label class="sheet-row">키프레임 크기 상한 (I-QP 하한, 실험)
      <select id="quality-qp">
        <option value="0">없음 (벤더 기본)</option>
        <option value="28">28 (기본)</option>
        <option value="32">32</option>
        <option value="36">36</option>
        <option value="40">40</option>
        <option value="44">44</option>
      </select>
    </label>
    <div class="sheet-row">
      <button id="quality-probe" class="state-action">끝에서 끝까지 지연 측정 (10회)</button>
      <span id="quality-result" class="sheet-note"></span>
    </div>
  </div>
  <div id="launcher" class="overlay sheet" data-ui hidden>
    <div class="sheet-head">
      <span id="launcher-title" class="sheet-title">홈</span>
      <input id="launcher-find" class="sheet-find" type="search" placeholder="앱 찾기" autocomplete="off" spellcheck="false">
      <button id="launcher-close" class="sheet-close" title="닫기">✕</button>
    </div>
    <div id="launcher-grid" class="grid"></div>
    <div id="launcher-empty" class="sheet-empty" hidden></div>
  </div>
</div>
<nav id="bar">
  <!-- 안드로이드 3버튼과 같은 자리·같은 모양·같은 크기: 왼쪽 최근, 가운데 홈, 오른쪽 뒤로.
       운전 중에는 읽지 않고 알아보는 것이라 폰의 것과 같아야 손이 먼저 안다. 세 글자 모두 폭이
       같은 선이고 상자에 들어 있지 않다 — 테두리를 두르는 순간 우리 버튼처럼 보인다. -->
  <div id="nav" class="nav-group">
    <button id="btn-recents" class="nav" title="최근 앱 (이 화면에서 도는 것)" aria-label="최근 앱">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5.5v13M12 5.5v13M18.5 5.5v13"/></svg>
    </button>
    <button id="btn-home" class="nav" title="홈 (차 화면의 앱 목록)" aria-label="홈">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/></svg>
    </button>
    <button data-key="back" class="nav" title="뒤로" aria-label="뒤로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 8.5 12 15 19.5"/></svg>
    </button>
  </div>
  <span id="stats" class="stats"></span>
  <!-- 오른쪽은 우리 도구들. 이모지를 쓰면 차 브라우저의 글꼴에 따라 크기도 색도 제각각이 되고
       (⌨ 는 여기서 작대기 하나로 그려졌다) 탐색 막대와 어울리지도 않는다. 같은 굵기의 선으로 그린다. -->
  <button id="btn-app" class="ic" title="앱 실행" aria-label="앱 실행">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 18 12l-9.5 6.5z"/></svg>
  </button>
  <button id="btn-screen" class="ic" title="폰 화면 끄기/켜기" aria-label="폰 화면 끄기/켜기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M10.5 5.3h3"/><path d="M5 21 19 3"/></svg>
  </button>
  <button id="btn-keyboard" class="ic" title="키보드" aria-label="키보드">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8.5 14h7"/></svg>
  </button>
  <button id="btn-quality" class="ic" title="화질 · 지연 측정" aria-label="화질">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-4 2.5 3 2-2.5L17 15"/></svg>
  </button>
  <button id="btn-fullscreen" class="ic" title="전체화면" aria-label="전체화면">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5"/></svg>
  </button>
  <button id="btn-save" class="ic" title="지금 상태를 폰에 저장" aria-label="지금 상태를 폰에 저장">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5h12l3.5 3.5v11.5h-15.5z"/><path d="M8.5 4.5v5h7v-5M8 19.5V14h8v5.5"/></svg>
  </button>
  <a href="diag.html" class="link ic" title="진단" aria-label="진단">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3 2.45V14M12 17h.01"/></svg>
  </a>
</nav>
<input id="kbd" class="kbd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
<script src="main.js?v=__BUILD__"></script>
</body>
</html>
