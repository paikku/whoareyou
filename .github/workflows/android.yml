name: android

# Heavy (APK build): runs when anything that ends up inside the APK changes, on tags, or on request.
#
# 웹도 여기 들어간다. 차가 여는 페이지는 assets/web 로 APK 안에 실려 폰이 서빙하므로, 웹만 고쳐도
# 새 APK 가 없으면 그 변경은 차에 닿지 않는다(web.yml 은 타입검사와 e2e 를 볼 뿐 APK 를 만들지 않는다).
# 루트의 package-lock.json 도 넣는다 — 웹 번들의 의존성이 거기서 정해진다.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'app/**'
      - 'adb/**'
      - 'shell-server/**'
      - 'core/**'
      - 'mux/**'
      - 'web/**'
      - 'tools/clips/assets/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'adb/**'
      - 'shell-server/**'
      - 'core/**'
      - 'mux/**'
      - 'web/**'
      - 'tools/clips/assets/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web toolchain
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # JDK 17 here: Kadb ships Java 21 class files, so a unit test that loads a class touching it
      # dies with UnsupportedClassVersionError. Keep pure logic out of those classes (see AdbServices).
      - name: Unit tests (core, mux, app, adb)
        run: ./gradlew :core:test :mux:test :app:testDebugUnitTest :adb:testDebugUnitTest --stacktrace

      - name: Assemble debug APK (bundles the web client)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/carcast-debug-${GITHUB_SHA::8}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: carcast-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
