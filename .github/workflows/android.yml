name: android

# Heavy (APK build): runs only when Android/Gradle sources change, on tags, or on manual request.
# Web-only changes are covered by web.yml; use "Run workflow" here when you need an APK for the phone.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'app/**'
      - 'adb/**'
      - 'shell-server/**'
      - 'mux/**'
      - 'tools/clips/assets/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'adb/**'
      - 'shell-server/**'
      - 'mux/**'
      - 'tools/clips/assets/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web toolchain
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (mux, app, adb)
        run: ./gradlew :mux:test :app:testDebugUnitTest :adb:testDebugUnitTest --stacktrace

      - name: Assemble debug APK (bundles the web client)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/carcast-debug-${GITHUB_SHA::8}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: carcast-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
