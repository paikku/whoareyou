name: web

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Tesla browser profile, Chrome 148)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck + build web client
        run: |
          npm run typecheck --workspace web
          npm run build --workspace web

      - name: Install Chrome for Testing 148 (matches Tesla firmware 2026.26)
        id: chrome
        working-directory: tests/e2e
        run: |
          out=$(npx @puppeteer/browsers install chrome@148 --path "$PWD/.cache" | tail -1)
          echo "$out"
          echo "path=${out#* }" >> "$GITHUB_OUTPUT"

      - name: Playwright deps
        working-directory: tests/e2e
        run: npx playwright install-deps chromium

      - name: Run e2e
        working-directory: tests/e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          CI: 'true'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
